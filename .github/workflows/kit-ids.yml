name: Kit IDs

on:
  workflow_dispatch:         # run by hand; prints your Kit tag, form and template numbers

permissions:
  contents: read

jobs:
  ids:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: List Kit IDs
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python scripts/kit_ids.py
