name: Evening shortlist

on:
  schedule:
    - cron: "30 18 * * *"   # 6:30 p.m. in winter (GMT), 7:30 p.m. in summer (BST)
  workflow_dispatch:         # adds a "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: shortlist
  cancel-in-progress: false

jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build shortlist and send to Telegram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/shortlist.py
      - name: Save shortlist to the repo
        run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Shortlist $(date -u +%F)"
          git pull --rebase
          git push
