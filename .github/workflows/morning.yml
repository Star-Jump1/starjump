name: Morning send

on:
  schedule:
    - cron: "0 5 * * *"     # 5 a.m. in winter (GMT), 6 a.m. in summer (BST)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read picks, schedule email, update archive
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ vars.MODE }}
          TESTER_TAG_ID: ${{ vars.TESTER_TAG_ID }}
          KIT_TEMPLATE_ID: ${{ vars.KIT_TEMPLATE_ID }}
          SEND_TIME: ${{ vars.SEND_TIME }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/send.py
      - name: Save archive and history to the repo
        run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Issue $(date -u +%F)"
          git pull --rebase
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
