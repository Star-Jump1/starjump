name: Evening draft

on:
  schedule:
    - cron: "*/15 19-23 * * *"   # every 15 minutes, 7 p.m. to midnight UTC
    - cron: "*/15 0 * * *"       # and until 12:45 a.m. UTC
  workflow_dispatch:             # run by hand for an instant preview

permissions:
  contents: write

concurrency:
  group: draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply your Telegram reply and send a preview
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/draft.py
      - name: Save draft to the repo
        run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Draft $(date -u +%F)"
          git pull --rebase
          git push
